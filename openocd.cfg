# OpenOCD config for the ClearCore's ATSAME53N19A over SWD.
#
# target/atsame5x.cfg's parts table explicitly includes SAME53N19A --
# verified against OpenOCD's own source (atsame5.c) -- so this is
# genuinely-supported, not a workaround.
#
# Swap the `source [find interface/...]` line for whichever probe you
# actually have:
#   - J-Link:     interface/jlink.cfg   (well-established, should just work)
#   - Atmel-ICE:  unverified which OpenOCD interface script matches -- it
#     has historically leaned on Microchip Studio's own driver stack rather
#     than generic OpenOCD. Check this once you have the probe in hand
#     rather than assuming cmsis-dap.cfg is correct.

source [find interface/jlink.cfg]
transport select swd

set CHIPNAME same53
source [find target/atsame5x.cfg]

adapter speed 4000
